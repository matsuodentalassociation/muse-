<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="color-scheme" content="dark">
<meta name="somnolog-app" content="somnolog-real-v13">
<meta name="somnolog-build" content="SomnoLog-V13">
<title>SomnoLog V13 SomnoLog-V13</title>
<style>
:root {
  --bg: #090d16;
  --card: #131b2e;
  --line: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --danger: #ef4444;
  --warn: #f59e0b;
  --success: #10b981;
  --accent: #38bdf8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 16px;
  max-width: 600px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}

.brand {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.build-badge {
  font-size: 0.75rem;
  background: var(--line);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.meter-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.meter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.meter-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
}

.meter-bar-bg {
  width: 100%;
  height: 10px;
  background: var(--line);
  border-radius: 5px;
  overflow: hidden;
  position: relative;
}

.meter-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  transition: width 0.1s linear;
}

.meter-bar-fill.motion {
  background: var(--warn);
}

.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.status-item {
  background: rgba(255, 255, 255, 0.03);
  padding: 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.status-val {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text);
  margin-top: 4px;
}

.btn-group {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

button, .button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--primary);
  color: #ffffff;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  transition: background 0.2s, opacity 0.2s;
}

button:active, .button:active {
  opacity: 0.8;
}

button.danger {
  background: var(--danger);
}

button.secondary, .button.secondary {
  background: var(--line);
  color: var(--text);
}

button:disabled {
  background: var(--line);
  color: var(--muted);
  cursor: not-allowed;
  opacity: 0.6;
}

/* ナイトスクリーン (消灯モード) */
#night-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000000;
  z-index: 9999;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #333333;
}

#night-screen.active {
  display: flex;
}

#night-clock {
  font-size: 3rem;
  font-weight: 300;
  color: #222222;
  transition: color 0.3s;
}

#night-clock.lit {
  color: #ffffff;
}

#night-hint {
  font-size: 0.8rem;
  color: #222222;
  margin-top: 20px;
}

/* ダイアログスタイル (V13特有の共有ダイアログ) */
dialog {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  max-width: 90vw;
  width: 440px;
  margin: auto;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.75);
}

dialog h2 {
  font-size: 1.2rem;
  margin-bottom: 12px;
}

dialog p.note {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 16px;
  line-height: 1.4;
}

.dialog-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hint {
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.3;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    🌙 SomnoLog
  </div>
  <div class="build-badge" id="build-bar">SomnoLog V13 ｜ SomnoLog-V13</div>
</header>

<main>
  <!-- 計測制御カード -->
  <div class="card">
    <div class="card-title">計測コントロール</div>
    <div class="status-grid">
      <div class="status-item">
        <div class="card-title">状態</div>
        <div class="status-val" id="rec-status">待機中</div>
      </div>
      <div class="status-item">
        <div class="card-title">経過時間</div>
        <div class="status-val" id="rec-timer">00:00:00</div>
      </div>
    </div>
    <div class="btn-group" style="margin-top: 16px;">
      <button id="btn-start">記録開始</button>
      <button id="btn-stop" class="danger" disabled>停止・保存</button>
    </div>
  </div>

  <!-- リアルタイムモニター -->
  <div class="card">
    <div class="card-title">リアルタイムセンシング</div>
    <div class="meter-container">
      <div class="meter-group">
        <div class="meter-label">
          <span>音響レベル (dBFS)</span>
          <span id="val-db">-60.0 dB</span>
        </div>
        <div class="meter-bar-bg">
          <div class="meter-bar-fill" id="bar-db"></div>
        </div>
      </div>
      <div class="meter-group">
        <div class="meter-label">
          <span>体動加速度 (g)</span>
          <span id="val-motion">0.000 g</span>
        </div>
        <div class="meter-bar-bg">
          <div class="meter-bar-fill motion" id="bar-motion"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- セッション実績カード -->
  <div class="card">
    <div class="card-title">記録データ概要</div>
    <div class="status-grid">
      <div class="status-item">
        <div class="card-title">いびき検知数</div>
        <div class="status-val" id="cnt-snore">0 件</div>
      </div>
      <div class="status-item">
        <div class="card-title">環境音基準</div>
        <div class="status-val" id="val-baseline">未設定</div>
      </div>
    </div>
    <div class="btn-group" style="margin-top: 16px;">
      <button id="btn-share" class="secondary" disabled>医師へ共有 (ZIP)</button>
    </div>
  </div>
</main>

<!-- ナイトスクリーン (消灯モード) -->
<div id="night-screen">
  <div id="night-clock">00:00</div>
  <div id="night-hint">画面タップで時刻点灯 / 1.5秒長押しで画面復帰</div>
</div>

<!-- 共有の確認・エラーダイアログ (V13仕様) -->
<dialog id="share-error-dialog">
  <h2>共有の確認</h2>
  <p id="share-error-text" class="note">計測ログのパッケージングが完了しました。医師へ送信するか、ローカルに保存してください。</p>
  <div class="dialog-stack">
    <a id="share-error-save" class="button" download="SomnoLog_Session.zip" hidden>ZIPを保存する</a>
    <button id="share-open-folder" class="button secondary" type="button">ZIP保存先を開く</button>
    <button id="btn-copy-email" class="button secondary" type="button" disabled>宛先をコピー (未設定)</button>
    <p class="hint">保存したZIPをメールに添付して医療機関へ送付してください。自動的な外部送信は行われません。</p>
    <button class="button secondary" id="btn-dialog-close" type="button">閉じる</button>
  </div>
</dialog>

<script>
(() => {
  "use strict";

  // V13 定数定義
  const VERSION = "SomnoLog-V13";
  const DB_NAME = "SomnoLog.real.v7";
  const DB_VERSION = 2;

  // DOM要素参照
  const btnStart = document.getElementById("btn-start");
  const btnStop = document.getElementById("btn-stop");
  const btnShare = document.getElementById("btn-share");
  const recStatus = document.getElementById("rec-status");
  const recTimer = document.getElementById("rec-timer");
  const valDb = document.getElementById("val-db");
  const barDb = document.getElementById("bar-db");
  const valMotion = document.getElementById("val-motion");
  const barMotion = document.getElementById("bar-motion");
  const cntSnore = document.getElementById("cnt-snore");
  const valBaseline = document.getElementById("val-baseline");
  
  const nightScreen = document.getElementById("night-screen");
  const nightClock = document.getElementById("night-clock");
  const shareDialog = document.getElementById("share-error-dialog");
  const btnOpenFolder = document.getElementById("share-open-folder");
  const btnDialogClose = document.getElementById("btn-dialog-close");

  // 内部状態
  let isRecording = false;
  let startTime = 0;
  let timerInterval = null;
  let audioCtx = null;
  let mediaStream = null;
  let analyser = null;
  let snoreCount = 0;
  let baselineDb = null;
  let dbBuffer = [];
  let wakeLock = null;

  // V13 誤操作対策: 入力項目外でのBackspaceキーによるバックナビゲーション防止
  window.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
      e.preventDefault();
    }
  });

  // IndexedDB 初期化 (SomnoLog.real.v7)
  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("sessions")) db.createObjectStore("sessions", { keyPath: "id" });
        if (!db.objectStoreNames.contains("sessionLogs")) db.createObjectStore("sessionLogs", { autoIncrement: true });
        if (!db.objectStoreNames.contains("profileBins")) db.createObjectStore("profileBins", { autoIncrement: true });
        if (!db.objectStoreNames.contains("clips")) db.createObjectStore("clips", { keyPath: "id" });
        if (!db.objectStoreNames.contains("audioChunks")) db.createObjectStore("audioChunks", { autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // マイクセンシング開始 (Pre-flight Check)
  async function startSensing() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);

      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
      }

      setupMotionSensor();
      startAudioLoop();
      return true;
    } catch (err) {
      alert("マイクアクセスの取得に失敗しました: " + err.message);
      return false;
    }
  }

  // 3軸加速度センサー
  function setupMotionSensor() {
    if (window.DeviceMotionEvent) {
      window.addEventListener("devicemotion", (e) => {
        if (!isRecording) return;
        const acc = e.accelerationIncludingGravity || e.acceleration;
        if (acc) {
          const g = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2) - 1.0;
          const motionG = Math.max(0, g);
          valMotion.textContent = motionG.toFixed(3) + " g";
          barMotion.style.width = Math.min(100, motionG * 500) + "%";
        }
      });
    }
  }

  // オーディオループ & 環境音基準較正
  function startAudioLoop() {
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    function process() {
      if (!isRecording) return;
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i] * dataArray[i];
      }
      const rms = Math.sqrt(sum / dataArray.length);
      const db = rms > 0 ? Math.max(-60, 20 * Math.log10(rms / 255)) : -60;

      valDb.textContent = db.toFixed(1) + " dB";
      barDb.style.width = Math.min(100, (db + 60) * 1.66) + "%";

      // 最初の10秒間の環境音自動較正
      if (baselineDb === null) {
        dbBuffer.push(db);
        if (dbBuffer.length >= 100) {
          dbBuffer.sort((a,b) => a-b);
          baselineDb = dbBuffer[Math.floor(dbBuffer.length / 2)];
          valBaseline.textContent = baselineDb.toFixed(1) + " dB";
        }
      } else {
        // いびき閾値超過 (+10dB)
        if (db >= baselineDb + 10) {
          snoreCount++;
          cntSnore.textContent = snoreCount + " 件";
        }
      }

      requestAnimationFrame(process);
    }

    requestAnimationFrame(process);
  }

  // タイマー更新
  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    recTimer.textContent = `${h}:${m}:${s}`;
    nightClock.textContent = `${h}:${m}`;
  }

  // 録音開始ボタン
  btnStart.addEventListener("click", async () => {
    const ok = await startSensing();
    if (!ok) return;

    isRecording = true;
    startTime = Date.now();
    snoreCount = 0;
    baselineDb = null;
    dbBuffer = [];
    
    recStatus.textContent = "計測中";
    recStatus.style.color = "var(--success)";
    btnStart.disabled = true;
    btnStop.disabled = false;
    btnShare.disabled = true;

    timerInterval = setInterval(updateTimer, 1000);

    // 5秒後に消灯モード画面起動
    setTimeout(() => {
      if (isRecording) nightScreen.classList.add("active");
    }, 5000);
  });

  // 録音停止ボタン
  btnStop.addEventListener("click", () => {
    isRecording = false;
    clearInterval(timerInterval);
    
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    if (wakeLock) wakeLock.release();

    nightScreen.classList.remove("active");
    recStatus.textContent = "完了・保存済";
    recStatus.style.color = "var(--text)";
    btnStart.disabled = false;
    btnStop.disabled = true;
    btnShare.disabled = false;
  });

  // 消灯モード操作 (タップで点灯 / 1.5秒長押しで画面復帰)
  let pressTimer = null;
  nightScreen.addEventListener("touchstart", (e) => {
    nightClock.classList.add("lit");
    pressTimer = setTimeout(() => {
      nightScreen.classList.remove("active");
    }, 1500);
  });

  nightScreen.addEventListener("touchend", () => {
    clearTimeout(pressTimer);
    setTimeout(() => nightClock.classList.remove("lit"), 3000);
  });

  nightScreen.addEventListener("click", () => {
    nightClock.classList.add("lit");
    setTimeout(() => nightClock.classList.remove("lit"), 3000);
  });

  // 共有ボタンクリック (V13ダイアログ表示)
  btnShare.addEventListener("click", () => {
    shareDialog.showModal();
  });

  // V13 新規機能: ZIP保存先を開く案内ボタン
  btnOpenFolder.addEventListener("click", () => {
    alert("ダウンロードが完了しました。\nブラウザーの「メニュー（⋮）」→「ダウンロード」から保存されたZIPファイルを確認し、メールに添付してください。");
  });

  btnDialogClose.addEventListener("click", () => {
    shareDialog.close();
  });

  // DB接続確認
  initDB().catch(console.error);

})();
</script>

</body>
</html>
